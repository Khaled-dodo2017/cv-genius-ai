function applyPrivacyLanguage() {
  let saved = "ar";

  try {
    saved = localStorage.getItem("cvGeniusAI_language") || "ar";
  } catch (error) {
    saved = "ar";
  }

  const lang = ["ar", "fr", "en"].includes(saved) ? saved : "ar";
  const data = content[lang];

  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

  document.getElementById("pageTitle").textContent = data.title;

  const managedBy = document.getElementById("managedBy");
  managedBy.replaceChildren(
    document.createTextNode(data.managedBy + " "),
    Object.assign(document.createElement("strong"), { textContent: "Am" })
  );

  document.title = data.title + " - CV Genius AI";
  document.getElementById("updated").textContent = data.updated;

  data.headings.forEach((text, i) => {
    document.getElementById("h" + (i + 1)).textContent = text;
  });

  data.paragraphs.forEach((text, i) => {
    document.getElementById("p" + (i + 1)).textContent = text;
  });

  document.getElementById("contactLink").textContent = data.contact;
  document.getElementById("homeLink").textContent = data.home;
}
